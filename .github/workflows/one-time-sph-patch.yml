name: One-time SPH widget integration

on:
  push:
    branches:
      - feature/sph-stundenplan-widgets

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sph-stundenplan-widgets
          fetch-depth: 0
      - name: Apply integration patch
        run: python3 .github/scripts/add_sph_widgets.py
      - name: Remove one-time patch files
        run: rm -f .github/scripts/add_sph_widgets.py .github/workflows/one-time-sph-patch.yml
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/eink_dashboard/svg_render.py custom_components/eink_dashboard/frontend/src/eink-dashboard-editor.ts
          git add -u .github/scripts/add_sph_widgets.py .github/workflows/one-time-sph-patch.yml
          git diff --cached --quiet || git commit -m "Integrate SPH timetable widgets"
          git push origin feature/sph-stundenplan-widgets
